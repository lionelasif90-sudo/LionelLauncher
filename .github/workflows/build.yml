name: Build Lionel APK
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: chmod +x ./gradlew
      - run: mkdir -p ~/.gradle && cp .github/ci-gradle.properties ~/.gradle/gradle.properties
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5

      # Stable signing key so every new APK installs over the previous one.
      # Best: add repo secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS (see scripts/make-keystore.sh).
      # Fallback: a key generated once and kept in the Actions cache.
      - uses: actions/cache@v4
        with:
          path: ~/lionel-keystore
          key: lionel-keystore-v1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_AL: ${{ secrets.KEY_ALIAS }}
        run: |
          mkdir -p "$HOME/lionel-keystore"
          KS="$HOME/lionel-keystore/lionel.jks"
          PW="${STORE_PW:-lionel-build-key}"
          AL="${KEY_AL:-lionel}"
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS"
          elif [ ! -f "$KS" ]; then
            keytool -genkeypair -keystore "$KS" -storepass "$PW" -keypass "$PW" -alias "$AL" \
              -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Lionel Launcher,O=Lionel,C=US"
          fi
          {
            echo "LIONEL_KEYSTORE=$KS"
            echo "LIONEL_STORE_PASSWORD=$PW"
            echo "LIONEL_KEY_ALIAS=$AL"
            echo "LIONEL_KEY_PASSWORD=$PW"
          } >> "$GITHUB_ENV"

      # Release build = R8 shrinking + optimized Compose. Much faster than a debug APK.
      - name: Build release APK
        run: ./gradlew :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v7
        with:
          name: LionelLauncher-release
          path: app/build/outputs/apk/release/*.apk

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" app/build/outputs/apk/release/*.apk --title "${GITHUB_REF_NAME}" --generate-notes
